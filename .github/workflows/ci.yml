name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Reader dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/reader

      - name: Books data validation
        run: npm run books:check

      - name: Type check
        run: npm run typecheck

      - name: Wrangler types check
        run: npm run cf:types:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Install Reader dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/reader

      - name: Reader security audit
        run: npm audit --audit-level=moderate
        working-directory: apps/reader

  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/reader/package-lock.json

      - name: Install Reader dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/reader

      - name: Install Reader Chrome and system dependencies
        run: npx playwright install --with-deps chrome
        working-directory: apps/reader

      - name: Generate Reader Worker types
        run: npm run types
        working-directory: apps/reader

      - name: Reader type check
        run: npm run typecheck
        working-directory: apps/reader

      - name: Reader local integration verification
        run: npm run verify
        working-directory: apps/reader

      - name: Upload Book Library browser previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-book-library-preview
          path: |
            apps/reader/.cloudflare/library-rehearsal/run-*/home-mobile.png
            apps/reader/.cloudflare/library-rehearsal/run-*/library-mobile.png
            apps/reader/.cloudflare/library-rehearsal/run-*/book-mobile.png
            apps/reader/.cloudflare/library-rehearsal/run-*/editor-desktop.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
